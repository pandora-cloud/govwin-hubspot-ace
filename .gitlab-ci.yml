stages:
  - test
  - lint
  - integration
  - security
  - maintenance

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  SAST_EXCLUDED_PATHS: ".terraform, .venv, venv, node_modules"

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements-dev.txt
  script:
    # Coverage gate is configured in pyproject.toml ([tool.coverage]).
    # Threshold + ratchet policy documented in MAINTAINERS.md.
    - python -m pytest tests/unit -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  allow_failure: false

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check src/ tests/
  allow_failure: false

docs-properties-drift:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements-dev.txt
  script:
    - python scripts/generate_hubspot_properties_doc.py
    - |
      if ! git diff --quiet docs/reference/hubspot-properties.md; then
        echo "ERROR: docs/reference/hubspot-properties.md is out of date."
        echo "Run 'make docs-properties' locally and commit the result."
        git --no-pager diff docs/reference/hubspot-properties.md | head -60
        exit 1
      fi
  allow_failure: false

integration:
  stage: integration
  image: python:3.12-slim
  services:
    # LocalStack community edition pinned to match docker-compose.yml and
    # ADR 0007's choice of LocalStack as the AWS emulator. The `:3.8` tag
    # is the last community-licensed line; `:latest` requires a paid auth
    # token as of mid-2026.
    - name: localstack/localstack:3.8
      alias: localstack
  variables:
    # boto3 reads AWS_ENDPOINT_URL natively for endpoint overrides; this
    # is what makes the tests/integration suite point at LocalStack.
    AWS_ENDPOINT_URL: "http://localstack:4566"
    AWS_DEFAULT_REGION: "us-east-1"
    # LocalStack accepts any credentials; the test/test pair is the
    # conventional placeholder.
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    # The integration tests build AppConfig from these env vars. Names
    # match what scripts/localstack-init.sh seeds.
    SYNC_STATE_TABLE: "govwin-hubspot-dev-sync-state"
    ENTITY_MAPPINGS_TABLE: "govwin-hubspot-dev-entity-mappings"
    GOVWIN_SECRET_NAME: "govwin-hubspot-dev/govwin"
    HUBSPOT_SECRET_NAME: "govwin-hubspot-dev/hubspot"
    GOVWIN_TOKENS_SECRET_NAME: "govwin-hubspot-dev/govwin-tokens"
    # Tests don't exercise the webhook receiver path against LocalStack
    # today, but the config validator requires the env var to exist.
    HUBSPOT_WEBHOOK_SECRET_NAME: "govwin-hubspot-dev/hubspot-webhook"
    # FIPS endpoint resolution does not work against LocalStack; the
    # conftest in tests/ already disables it for the unit suite. Mirror
    # that here for the integration job.
    AWS_USE_FIPS_ENDPOINT: "false"
    # awscli-local (awslocal) reads LOCALSTACK_HOSTNAME and EDGE_PORT
    # to target the endpoint; AWS_ENDPOINT_URL is also respected but
    # explicit is better. The service container is aliased "localstack".
    LOCALSTACK_HOSTNAME: "localstack"
    EDGE_PORT: "4566"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - pip install --quiet -r requirements-dev.txt awscli awscli-local
    # Wait for LocalStack to be ready. The health endpoint returns 200
    # only once every service we plan to use is in "running" state.
    - |
      timeout=60
      until curl -sf http://localstack:4566/_localstack/health > /dev/null 2>&1; do
        timeout=$((timeout - 2))
        if [ $timeout -le 0 ]; then echo "LocalStack did not become healthy in 60s"; exit 1; fi
        sleep 2
      done
    # Seed DynamoDB tables, Secrets Manager secrets, SNS, and SQS. The
    # script already uses awslocal which is awscli-local installed
    # above; it implicitly targets http://localhost:4566 from inside
    # the LocalStack container, but in the CI runner it needs to talk
    # to the `localstack` service container. awscli-local respects
    # AWS_ENDPOINT_URL, which we set in variables: above.
    - bash scripts/localstack-init.sh
  script:
    - python -m pytest tests/integration -v --tb=short
  allow_failure: false

supply-chain-audit:
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet pip-audit uv
  script:
    # Verify the committed requirements.lock matches uv.lock; otherwise the
    # audit could pass against a stale snapshot of the dependency graph.
    - uv export --format=requirements-txt --no-dev --no-emit-project 2>/dev/null > /tmp/requirements.lock.expected
    - diff -q requirements.lock /tmp/requirements.lock.expected || (echo "requirements.lock out of sync; run make lock"; diff requirements.lock /tmp/requirements.lock.expected | head -40; exit 1)
    - pip-audit -r requirements.lock --disable-pip
  allow_failure: false

renovate:
  stage: maintenance
  image: renovate/renovate:slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: '["pandora-cloud/oss/govwin-hubspot-ace"]'
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@$CI_SERVER_HOST>"
  script:
    - renovate
