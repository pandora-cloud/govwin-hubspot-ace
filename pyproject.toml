[project]
name = "govwin-hubspot-ace"
version = "2.1.0"
description = "Sync government contracting opportunities from Deltek GovWin IQ into HubSpot CRM"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "boto3>=1.34,<2.0",
    "tenacity>=8.0,<9.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto[dynamodb,secretsmanager,stepfunctions]>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,secretsmanager]",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
# Integration tests are opt-in and don't represent the unit-test contract
# the gate enforces; measure only what runs on every CI push.
omit = [
    "src/lambdas/__init__.py",
    "src/ace/__init__.py",
    "src/govwin/__init__.py",
    "src/hubspot/__init__.py",
    "src/sync/__init__.py",
]

[tool.coverage.report]
# Current baseline (2026-06): 79% line+branch, 82% line-only.
# Threshold starts conservative as a regression guard; ratchet up over
# time. Coverage policy documented in MAINTAINERS.md.
fail_under = 75
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.lambdas.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
